<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script id="lang-guard">
  (function() {
    // 1. 取得當前瀏覽器的 User-Agent 轉成小寫，用來識別訪客身份
    var ua = navigator.userAgent.toLowerCase();

    // 2. 搜尋引擎爬蟲防護：如果是 Google、Bing 等爬蟲，直接放行不轉址，保護 SEO 抓取
    if (/googlebot|bingbot|yahoobot|baiduspider|facebookexternalhit/i.test(ua)) return;

    // 3. 取得瀏覽器當前設定的語系並轉為小寫
    var lang = (navigator.language || navigator.userLanguage).toLowerCase();

    // 4. 中文語系放行：如果使用者瀏覽器是中文（zh），不進行轉址，直接留在首頁
    if (lang.startsWith('zh')) return;

    // 5. 基準網址鎖定：直接帶入第一站輸入的 siteDomain，並自動清除尾端多餘斜線、強制結尾加上斜線
    var baseUrl = "https://ibartifact-source.github.io/my-comic/";

    // 6. 預設目標路徑：非中文訪客預設導向英文版子目錄 (en/)
    var targetPath = "https://ibartifact-source.github.io/my-comic/en/";

    // 7. 韓文語系判斷：若訪客語系是韓文開頭（ko），將目標改為韓文版 (kr/)
    if (lang.startsWith('ko')) {
      targetPath = "https://ibartifact-source.github.io/my-comic/kr/";
    } 
    // 8. 英文語系判斷：若訪客語系是英文開頭（en），指定目標為英文版 (en/)
    else if (lang.startsWith('en')) {
      targetPath = "https://ibartifact-source.github.io/my-comic/en/";
    }

    // 9. 畫面隱藏防閃爍：在跳轉前瞬間隱藏整份網頁，避免中文內容短暫閃過影響體驗
    document.documentElement.style.display = 'none';

    // 10. 執行物理轉址：使用 replace 替換網址列，無縫跳轉到對應語言頁面
    location.replace(targetPath);
  })();
</script>
